name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Audit production dependencies
        if: matrix.node-version == 22
        run: npm audit --omit=dev
      - name: Type check hosted Worker
        if: matrix.node-version == 22
        run: npx tsc -p tsconfig.remote.json
      - name: Validate hosted Worker bundle
        if: matrix.node-version == 22
        run: npx wrangler deploy --config remote/wrangler.jsonc --dry-run --outdir /tmp/mcp-cloud-deploy-worker

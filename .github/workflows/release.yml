name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION" || {
            echo "Release tag v$RELEASE_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }
      - name: Ensure npm CLI supports trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build and test
        run: npm test
      - name: Verify published package contents
        run: npm pack --dry-run
      - name: Publish package with provenance
        run: npm publish --access public

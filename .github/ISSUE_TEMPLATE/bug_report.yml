name: Bug report
description: Report a reproducible problem with the MCP server.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API tokens, account IDs, domains you do not own, and private project data from logs before sharing.
  - type: input
    id: version
    attributes:
      label: mcp-cloud-deploy version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.x
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: MCP host
      options: [Claude Desktop, Cursor, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include tool inputs, but never include secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error output
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed credentials and other sensitive data.
          required: true
        - label: I checked existing issues for duplicates.
          required: true

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Deploy static sites, image-rich landing pages, and React apps to Cloudflare Pages from your MCP host.">
  <title>Deployed with mcp-cloud-deploy</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101827; color: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: radial-gradient(ellipse at 50% 0%, #24405b 0, #101827 55%); }
    main { width: min(720px, 100%); text-align: center; padding: clamp(32px, 7vw, 72px); border: 1px solid #ffffff1c; border-radius: 28px; background: #121d2bd9; box-shadow: 0 28px 90px #0005; }
    .mark { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 20px; color: #111827; font-size: 30px; background: linear-gradient(135deg, #f8d66d, #f28e55); }
    .eyebrow { color: #f6bd74; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 14px 0 16px; font-size: clamp(36px, 8vw, 62px); letter-spacing: -.055em; line-height: 1.02; }
    p { max-width: 510px; margin: 0 auto; color: #b8c3d2; font-size: 17px; line-height: 1.7; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 34px; padding: 10px 15px; border: 1px solid #55d6a455; border-radius: 999px; color: #a8f0d0; background: #55d6a411; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #55d6a4; box-shadow: 0 0 12px #55d6a4; }
    footer { margin-top: 44px; color: #748195; font-size: 12px; }
    footer strong { color: #aebaca; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/images/launch.svg" alt="A website being distributed to global Cloudflare edge locations" style="display:block;width:min(100%,560px);margin:0 auto 34px;border-radius:20px">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="eyebrow">Your site is live</div>
    <h1>Built locally.<br>Deployed globally.</h1>
    <p>This static page was published to Cloudflare Pages with <strong>mcp-cloud-deploy</strong>. Your next idea is only a build and a deploy away.</p>
    <div class="status"><span class="dot"></span> Cloudflare Pages deployment</div>
    <img src="/images/gallery/asset-card.svg" alt="Images and nested website assets travel with the build" loading="lazy" style="display:block;width:min(100%,380px);margin:34px auto 0;border-radius:16px">
    <img src="/images/gallery/deep-links.svg" alt="React single-page app deep links can be served with the Pages fallback" loading="lazy" style="display:block;width:min(100%,380px);margin:18px auto 0;border-radius:16px">
    <footer>Local-first deployment · <strong>mcp-cloud-deploy</strong></footer>
  </main>
</body>
</html>
